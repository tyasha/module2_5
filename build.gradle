plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	awssdkVersion = '2.54.13'
	jjwtVersion = '0.13.0'
}

dependencyManagement {
	imports {
		// единая версия для всех AWS SDK-модулей
		mavenBom "software.amazon.awssdk:bom:${awssdkVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// не JPA — см. PROGRESS.md
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	// community-драйвер, официального для MySQL нет
	runtimeOnly 'io.asyncer:r2dbc-mysql'

	// Flyway работает через blocking JDBC — у R2DBC нет поддержки миграций
	runtimeOnly 'org.springframework.boot:spring-boot-flyway' // без него автоконфигурация Flyway не подключится (Boot 4)
	runtimeOnly 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// JWT
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// клиент для MinIO (S3-совместимо); только асинхронный, синхронный тащит блокирующий http-клиент
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'apache5-client'
	}

	// не MVC-вариант — тот тут не заведётся
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// порядок важен — без неё Lombok и MapStruct конфликтуют при генерации кода
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// без этого не потестируешь Mono/Flux (StepVerifier)
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'

	// Testcontainers 2.x переименовал все модули с префиксом testcontainers-*
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers-r2dbc'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
