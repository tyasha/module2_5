plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	awssdkVersion = '2.54.13'
	jjwtVersion = '0.13.0'
}

dependencyManagement {
	imports {
		// разводим версии всех AWS SDK v2 модулей одной BOM — та же логика,
		// что Spring Boot делает для своих стартеров
		mavenBom "software.amazon.awssdk:bom:${awssdkVersion}"
	}
}

dependencies {
	// Web: реактивный стек, не MVC — см. PROGRESS.md, архитектурное решение №1
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// БД: реактивный доступ (R2DBC), не Spring Data JPA — см. PROGRESS.md
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	// официального R2DBC-драйвера для MySQL нет (в отличие от Postgres/MariaDB) —
	// io.asyncer:r2dbc-mysql — актуальный community-преемник dev.miku:r2dbc-mysql
	runtimeOnly 'io.asyncer:r2dbc-mysql'

	// Flyway мигрирует через отдельный БЛОКИРУЮЩИЙ JDBC-драйвер — у R2DBC нет
	// нативной поддержки миграций (тот же архитектурный шов, что в источнике №8)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// JWT
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	// MinIO через AWS SDK v2 S3-клиент (MinIO S3-совместим, endpointOverride на MinIO)
	implementation 'software.amazon.awssdk:s3'

	// OpenAPI/Swagger — реактивный вариант стартера, не MVC-шный
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.0'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// StepVerifier и т.п. для тестирования Mono/Flux — легко забыть, без него
	// starter-test не даёт нормально тестировать реактивный код
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'

	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
