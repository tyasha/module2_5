server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: file-storage-api

  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:filestorage}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  flyway:
    # Flyway у R2DBC нет нативной поддержки — мигрирует через отдельный
    # блокирующий JDBC-драйвер (mysql-connector-j), см. build.gradle
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:filestorage}
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    locations: classpath:db/migration

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:files}

jwt:
  # dev-значение по умолчанию — в проде переопределяется через JWT_SECRET (env). Не короче 32
  # байт — jjwt требует минимум 256 бит ключа для HS256, иначе падает при старте
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
